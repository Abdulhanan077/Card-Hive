name: mycardhive_mobile
description: A new Flutter project for Card Hive.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Necessary Plugins for Card Hive ---
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.1
  dio: ^5.4.3
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
