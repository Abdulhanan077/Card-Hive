workflows:
  ios-simulator-build:
    name: iOS Simulator Build (Appetize.io)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      groups:
        - firebase # Optional: For any firebase related env vars if needed
    
    scripts:
      - name: Get Flutter packages
        script: |
          cd mycardhive_mobile
          flutter pub get
          
      - name: Install CocoaPods
        script: |
          cd mycardhive_mobile/ios
          pod install
          
      - name: Build iOS Debug Application for Simulator
        script: |
          cd mycardhive_mobile
          flutter build ios --debug --simulator --no-codesign
          
      - name: Prepare Artifact for Appetize.io
        script: |
          cd mycardhive_mobile/build/ios/iphonesimulator
          # Zip the .app bundle for Appetize.io
          zip -r card_hive_simulator.zip Runner.app

    artifacts:
      - mycardhive_mobile/build/ios/iphonesimulator/*.zip
      
    publishing:
      email:
        recipients:
          - ${BUILD_SENDER_EMAIL}
        notify:
          success: true
          failure: true
