workflows:
  ios-simulator-build:
    name: iOS Simulator Build (Appetize.io)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: 15.4
      groups:
        - firebase # Optional: For any firebase related env vars if needed
    
    scripts:
      - name: Get Flutter packages
        script: |
          cd mycardhive_mobile
          flutter pub get
          
      - name: Install CocoaPods
        script: |
          cd mycardhive_mobile/ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          
      - name: Build iOS Debug Application for Simulator
        script: |
          cd mycardhive_mobile
          flutter build ios --simulator --debug
          
    artifacts:
      - mycardhive_mobile/build/ios/iphonesimulator/Runner.app
