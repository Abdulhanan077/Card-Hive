workflows:
  distribution-workflow:
    name: Card-Hive App Store Production
    integrations:
      app_store_connect: Codemagic API Key
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - shorebird
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mycardhive.trading
      flutter: 3.22.0
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          cd mycardhive_mobile
          flutter precache --ios
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd mycardhive_mobile/ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA with Shorebird
        script: |
          # Install Shorebird CLI
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
          
          cd mycardhive_mobile
          shorebird release ios --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mycardhive_mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
